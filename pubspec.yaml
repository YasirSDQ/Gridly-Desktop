name: gridly
description: "Gridly - Advanced Google Drive Manager Desktop Application with rclone integration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.8.3
  process_run: ^0.13.1
  file: ^7.0.0
  archive: ^3.4.9
  dio: ^5.4.0
  uuid: ^4.2.1
  intl: ^0.18.1
  fl_chart: ^0.65.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  window_manager: ^0.3.6
  bitsdojo_window: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
